services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: mini_ecommerce
      POSTGRES_USER: mini_ecommerce
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ecommerce_hub -d ecommerce_hub" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    container_name: web
    ports:
      - "5173:80"
    depends_on:
      - api

  api:
    build: .
    container_name: api
    ports:
      - "8080:8080"
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/mini_ecommerce
      DATASOURCE_USERNAME: mini_ecommerce
      DATASOURCE_PASSWORD: password
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: